<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход</title>
  <link rel="stylesheet" href="../styles/registration.css" />
</head>
<body>
  <div class="auth-card">
    <h1>Вход</h1>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
        <span class="error" data-error="email"></span>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required minlength="6" />
        <span class="error" data-error="password"></span>
      </div>

      <button type="submit" id="submitBtn">Войти</button>

      <a href="./registr.html" class="btn-login">Нет аккаунта? Зарегистрироваться</a>

      <p class="server-error" id="serverError"></p>
      <p class="success" id="successMsg"></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../app/login.js"></script>
</body>
</html>
