<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация</title>
  <link rel="stylesheet" href="../styles/registration.css" />
</head>
<body>
  <div class="auth-card">
    <h1>Регистрация</h1>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="name_user">Имя пользователя</label>
        <input type="text" id="name_user" name="name_user" required minlength="3" />
        <span class="error" data-error="name_user"></span>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
        <span class="error" data-error="email"></span>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required minlength="6" />
        <span class="error" data-error="password"></span>
      </div>

      <div class="field">
        <label for="password2">Повторите пароль</label>
        <input type="password" id="password2" name="password2" required />
        <span class="error" data-error="password2"></span>
      </div>

      <button type="submit" id="submitBtn">Зарегистрироваться</button>

      <!-- Кнопка перехода на страницу авторизации -->
      <a href="./login.html" class="btn-login">Уже есть аккаунт? Войти</a>

      <p class="server-error" id="serverError"></p>
      <p class="success" id="successMsg"></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../app/app.js"></script>
</body>
</html>
